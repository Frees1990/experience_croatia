{% extends "base.html" %}

{% block content %}
<!-- Container for the entire page -->
<aside id="contact-image">
    <!-- Centered Card -->
    <div class="card contact-card col s12 m8">
        <h4>Get in Touch</h4>
        <div class="card-content">
            <form id="contact-form">
                <div class="row">
                    <!-- Name input -->
                    <div class="input-field col s12 m4" style="margin-right: 20px;">
                        <input type="text" id="name" name="name" required>
                        <label for="name">Name</label>
                    </div>
                    <!-- Email input -->
                    <div class="input-field col s12 m4" style="margin-right: 20px;">
                        <input type="email" id="email" name="email" required>
                        <label for="email">Email</label>
                    </div>
                    <!-- Phone input -->
                    <div class="input-field col s12 m4">
                        <input type="text" id="number" name="number">
                        <label for="number">Phone</label>
                    </div>   
                </div>
                <div class="row">
                    <!-- Message input -->
                    <div class="input-field col s12 m12" style="margin-top: 20px;">
                        <textarea id="message" name="message" class="materialize-textarea" required></textarea>
                        <label for="message">Message</label>
                    </div>    
                </div>
                <!-- Submit button -->
                <div class="row">
                    <div class="col s12 ">
                        <button type="submit" class="btn white-text waves-effect waves-light">Send Message</button>
                    </div>
                </div>
            </form>
            
            <!-- Thank You message -->
            <div id="thank-you" style="display:none;">
                <p>Thank you for your message. We'll get back to you soon!</p>
            </div>
        </div>
    </div>
</aside>

{% endblock %}

<script>
    // Initialize EmailJS with your Public API Key
    (function() {
        emailjs.init("YOUR_PUBLIC_API_KEY"); // Replace with your Public API Key
    })();

    // Form submission handler
    document.getElementById('contact-form').addEventListener('submit', function(event) {
        event.preventDefault();  // Prevent the form from submitting normally

        var formData = new FormData(this);
        var name = formData.get('name');
        var email = formData.get('email');
        var phone = formData.get('number') || 'Not Provided';  // Default to 'Not Provided' if empty
        var message = formData.get('message');

        // Send email using EmailJS
        emailjs.sendForm('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', this)
            .then(function(response) {
                // Success callback
                console.log('Email sent successfully!', response);
                document.getElementById('thank-you').style.display = 'block';
                document.getElementById('contact-form').reset();  // Reset form
            }, function(error) {
                // Error callback
                console.error('Error sending email:', error);
                alert('Failed to send message. Please try again later.');
            });
    });
</script>
