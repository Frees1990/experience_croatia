{% extends "base.html" %}

{% block content %}

<aside id="contact-image">
    <!-- Centered Card -->
    <div class="card contact-card col s12 m8">
        <h4>Get in Touch</h4>
        <div class="card-content">
            <form id="contact_form" name="contact_form" method="POST">
                <div class="row">
                    <!-- Name input -->
                    <div class="input-field col s12 m4 m-3">
                        <input type="text" id="name" name="name" required>
                        <label for="name">Name</label>
                    </div>
                    <!-- Email input -->
                    <div class="input-field col s12 m4 m-3">
                        <input type="email" id="email" name="email" required>
                        <label for="email">Email</label>
                    </div>
                    <!-- Phone input -->
                    <div class="input-field col s12 m4 m-3">
                        <input type="number" id="number" name="number">
                        <label for="number">Phone</label>
                    </div>
                </div>
                <div class="row">
                    <!-- Message input -->
                    <div class="input-field col s12 m-3">
                        <textarea id="message" name="message" class="materialize-textarea" required></textarea>
                        <label for="message">Message</label>
                    </div>
                </div>
                <!-- Submit button -->
                <div class="row">
                    <div class="col s12 center">
                        <button type="submit" class="btn btn-small green white-light waves-effect waves-dark"
                            style="font-weight: 900;">Send Message</button>
                    </div>
                </div>
            </form>

            <!-- Thank You Feedback -->
            <div id="thank-you-feedback" style="display: none;">
                <div class="card-panel custom-card col s12 m8 offset-m2 p-5">
                    <h5>Thanks for reaching out to Experience Pula, Croatia!</h5>
                    <p>Your message is important to us, and we're excited to assist you in finding your dream holiday adventure.</p>
                    <a class="btn orange-text text-lighten-4 teal darken-4 rounded waves-effect waves-light"
                        href="{{ url_for('index') }}">Home</a>
                </div>
            </div>
        </div>
    </div>
</aside>
{% endblock %}
{% block javascript %}
<script>
    document.getElementById('submit_button').addEventListener('click', function (event) {
        // Prevent the form's default submission behavior
        event.preventDefault();

        // Get the form element and its data
        const form = document.getElementById('contact_form');
        const formData = new FormData(form);

        // Send the data using fetch
        fetch('/contact', {
            method: 'POST',
            body: formData,
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    console.log('Form submitted successfully:', data);

                    // Hide the form and show the thank-you message
                    form.style.display = 'none';
                    document.getElementById('thank-you-feedback').style.display = 'block';
                } else {
                    console.error('Submission error:', data);
                }
            })
            .catch(error => {
                console.error('Submission failed:', error);
                alert('Something went wrong. Please try again.');
            });
    });
</script>
{% endblock %}
