{% extends "base.html" %}

{% block content %}

<aside id="contact-image">
    <!-- Centered Card -->
    <div class="card contact-card col s12 m8">
        <h4>Get in Touch</h4>
        <div class="card-content">
            <form id="contact_form" name="contact_form" method="POST">
                <div class="row">
                    <!-- Name input -->
                    <div class="input-field col s12 m4 m-3">
                        <input type="text" id="name" name="name" required>
                        <label for="name">Name</label>
                    </div>
                    <!-- Email input -->
                    <div class="input-field col s12 m4 m-3">
                        <input type="email" id="email" name="email" required>
                        <label for="email">Email</label>
                    </div>
                    <!-- Phone input -->
                    <div class="input-field col s12 m4 m-3">
                        <input type="number" id="number" name="number">
                        <label for="number">Phone</label>
                    </div>
                </div>
                <div class="row">
                    <!-- Message input -->
                    <div class="input-field col s12 m-3">
                        <textarea id="message" name="message" class="materialize-textarea" required></textarea>
                        <label for="message">Message</label>
                    </div>
                </div>
                <!-- Submit button -->
                <div class="row">
                    <div class="col s12 center">
                        <button type="submit" id="submit_button"
                            class="btn btn-small green white-light waves-effect waves-dark"
                            style="font-weight: 900;">Send Message</button>
                    </div>
                </div>
            </form>
            <p id="success-message" style="display: none; color: green; text-align: center;">
                Your message has been sent successfully!
            </p>
            <p id="error-message" style="display: none; color: red; text-align: center;">
                Something went wrong. Please try again.
            </p>
        </div>
    </div>
</aside>
{% endblock %}
{% block javascript %}
<!-- Include EmailJS SDK -->
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
    (function() {
        emailjs.init("AiuvVMWIqUo7pR59Q"); // Replace with your EmailJS Public Key
    })();

    document.getElementById("contact_form").addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent the form from refreshing the page

        // Template Parameters
        const templateParams = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("number").value,
            message: document.getElementById("message").value
        };

        // Send EmailJS message
        emailjs.send("contact_service", "contact_form", templateParams)
            .then(function(response) {
                console.log("SUCCESS!", response.status, response.text);
                // Redirect to thank_you page after success
                window.location.href = "{{ url_for('thank_you') }}";
            }, function(error) {
                console.log("FAILED...", error);
                alert("Message failed to send. Please try again.");
            });
    });
</script>
{% endblock %}
