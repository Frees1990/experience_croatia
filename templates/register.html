{% extends "base.html" %}

{% block content %}
<!-- Container for the entire page -->

<aside id="registerImage">
    <!-- Centered Card -->
    <div class="card reg-card col s12 m8">
        <h4 class="highlight-text">Experience Pula, Croatia</h4>
        <h6 class="highlight-text">Experience the wonderful culture, nightlife, and the sunny life in Croatia. Register to receive exclusive offers.</h6>

        <!-- Registration Form -->
        <div class="card-content">
            <form id="regForm" method="POST" action="{{ url_for('register') }}" aria-label="registration form">
                <div class="row">
                    <!-- Full Name / Username -->
                    <div class="input-field col s12 m4" style="margin-right: 20px;">
                        <i class="fas fa-user prefix green-text text-darken-4"></i>
                        <input id="name" name="name" type="text" pattern="[A-Za-z ]{5,32}" class="validate" required>
                        <label for="name">Full Name</label>
                    </div>
                    <div class="input-field col s12 m4" style=" margin-right: 20px; margin-bottom: 20px;">
                        <i class="fas fa-user-plus prefix green-text text-darken-4"></i>
                        <input id="username" name="username" type="text" minlength="5" maxlength="15" pattern="^[a-zA-Z0-9]{5,15}$" class="validate" required>
                        <label for="username">Username </label>
                    </div>
                    <div class="input-field col s12 m4">
                        <i class="fas fa-mobile prefix green-text text-darken-4"></i>
                        <input id="number" name="number" type="number" class="validate" required>
                        <label for="number">Mobile Number</label>
                    </div>
                </div>
                <div class="row">
                    <!-- Email / Mobile -->
                    <div class="input-field col s12 m4" style="margin-right: 20px; margin-bottom: 20px;">
                        <i class="fas fa-envelope prefix green-text text-darken-4"></i>
                        <input id="email" name="email" type="email" minlength="5" maxlength="100" class="validate" required>
                        <label for="email">E-mail</label>
                    </div>
                    <!-- Password / Confirm Password -->
                    <div class="input-field col s12 m4" style="margin-right: 20px;">
                        <i class="fas fa-user-lock prefix green-text text-darken-4"></i>
                        <input id="password" name="password" type="password" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" class="validate" required>
                        <label for="password">Password </label>
                    </div>
                    <div class="input-field col s12 m4">
                        <i class="fas fa-user-lock prefix green-text text-darken-4"></i>
                        <input id="confirm_password" name="confirm_password" type="password" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" class="validate" required>
                        <label for="confirm_password">Confirm Password </label>  
                    </div>
                </div>   
                <div class="col s12 center-align">
                    <button type="submit" class="btn green darken-3 white-text waves-effect waves-light">REGISTER</button>
                </div>           
            </form>
        </div>   
        <div class="row">
            <div class="col s12 center-align already-reg">
                <!-- Link to login page -->
                <p>ALREADY REGISTERED?....<a href="{{ url_for('login') }}" class="loginlink"><b>LOG IN HERE</b></a></p>
            </div>
        </div>
    </div>
</aside>


{% endblock %}

{% block javascript %}
<script>
    // allow users to toggle password visibility
    function togglePasswordVisibility(inputId, toggleIcon) {
        const inputField = document.getElementById(inputId);
        const icon = document.getElementById(toggleIcon);

        if (inputField.type === "password") {
            inputField.type = "text";
            icon.classList.add("green-text", "text-darken-4");
        } else {
            inputField.type = "password";
            icon.classList.remove("green-text", "text-darken-4");
        }
    }
</script>
{% endblock %}

<!-- Add custom CSS for the full-page background and card centering -->
<style>
    /* Full Page Background */
    #registerImage {
        background-image: url('your-image-url.jpg'); /* Replace with your image URL */
        background-size: cover; /* Ensure the image covers the entire viewport */
        background-position: center center; /* Center the background image */
        background-attachment: fixed; /* Ensure background stays fixed on scroll */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh; /* Full height of the viewport */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Make the card smaller and centered */
    .contact-card {
        width: 100%;
        max-width: 600px;  /* Adjust width as per your preference */
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent background */
        margin: 0 auto;  /* Center the card horizontally */
        box-sizing: border-box;
    }

    .page-container {
        padding-top: 20px;
    }

    .regHeader {
        text-align: center;
        color: white;
    }

    .col.s12.center-align {
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
